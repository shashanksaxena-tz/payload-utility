<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payload Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">P</span>
        <span class="brand-text">Payload</span>
      </div>
      <ul class="nav-list" id="nav-list"></ul>
      <div class="sidebar-footer">
        <a href="#settings" class="nav-link" data-page="settings">
          <span class="nav-icon">&#9881;</span>
          <span>Settings</span>
        </a>
      </div>
    </nav>
    <main id="main">
      <header id="topbar">
        <button id="sidebar-toggle" class="btn-icon" aria-label="Toggle sidebar">&#9776;</button>
        <h1 id="page-title">Dashboard</h1>
        <div id="status-indicator"></div>
      </header>
      <div id="content"></div>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="btn-icon modal-close" onclick="window.__closeModal()">&#10005;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
